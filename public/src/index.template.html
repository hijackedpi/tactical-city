<!DOCTYPE html>
<html>
<head>
<title>de_alcazar</title>
<style>
  body { margin:0; overflow:hidden; font-family:'Segoe UI',sans-serif; background:#87CEEB; }
  /* ── CS2-STYLE HUD ── */
  #cs-health {
    position:absolute; bottom:26px; left:30px; pointer-events:none;
    font-family:'Stratum2','Arial Narrow',sans-serif;
  }
  #cs-health .cs-row { display:flex; align-items:center; gap:10px; }
  #cs-health .cs-icon { color:#e02828; font-size:30px; line-height:1; }
  #cs-hp-num {
    color:#fff; font-size:52px; font-weight:bold; line-height:0.9;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);
  }
  #cs-health.low #cs-hp-num, #cs-health.low .cs-icon { color:#e64b3c; }
  #cs-health .cs-bar {
    width:240px; height:6px; margin-top:6px; background:rgba(0,0,0,0.55);
    border-radius:2px; overflow:hidden;
  }
  #cs-hp-fill { height:100%; width:100%; background:#ffe11a; transition:width 0.12s, background 0.12s; }
  #cs-health.low #cs-hp-fill { background:#e64b3c; }

  /* ── AMMO PANEL ── mag fill on the left of the slash, capacity on the right,
     spare magazines as pips beneath. ── */
  #cs-ammo {
    position:absolute; bottom:24px; right:30px; pointer-events:none;
    font-family:'Stratum2','Arial Narrow',sans-serif; color:#fff;
    text-align:right; min-width:196px; padding:13px 17px 12px;
    background:linear-gradient(158deg, rgba(20,25,32,0.60), rgba(9,12,16,0.80));
    border:1px solid rgba(255,255,255,0.09);
    border-radius:7px;
    box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  }
  #cs-ammo-row { display:flex; align-items:baseline; justify-content:flex-end; }
  #cs-ammo-clip {
    font-size:58px; font-weight:800; line-height:0.84;
    font-variant-numeric:tabular-nums; letter-spacing:-1px;
    text-shadow:0 2px 12px rgba(0,0,0,0.75);
    transition:color .12s;
  }
  #cs-ammo-sep { font-size:26px; color:#5e6b78; margin:0 4px 0 6px; font-weight:600; }
  #cs-ammo-reserve {
    font-size:27px; color:#8c99a6; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  /* how full the loaded magazine is */
  #cs-magbar {
    height:3px; margin-top:10px; border-radius:2px;
    background:rgba(255,255,255,0.09); overflow:hidden;
  }
  #cs-magbar i {
    display:block; height:100%; width:100%; border-radius:2px;
    background:linear-gradient(90deg, #9fb6c9, #ffffff);
    transition:width .13s ease-out, background .13s;
  }
  /* one pip per spare magazine */
  #cs-mags { display:flex; gap:5px; justify-content:flex-end; margin-top:9px; height:10px; }
  #cs-mags i {
    display:block; width:19px; height:10px; border-radius:2px; position:relative;
    border:1px solid rgba(190,205,220,0.26); background:rgba(0,0,0,0.32);
    overflow:hidden;
  }
  #cs-mags i::after {
    content:''; position:absolute; inset:0; width:calc(var(--f,0) * 100%);
    background:linear-gradient(180deg, #ffffff, #c8d6e2);
    box-shadow:0 0 7px rgba(200,225,255,0.45);
  }
  #cs-mags i.part::after { background:linear-gradient(180deg, #ffd27a, #f2a93c); box-shadow:0 0 7px rgba(242,169,60,0.45); }
  #cs-ammo-name {
    font-size:11px; letter-spacing:3.6px; color:#77838f;
    margin-top:9px; font-weight:700;
  }
  /* running low on the loaded mag */
  #cs-ammo.low #cs-ammo-clip { color:#f2b23c; }
  #cs-ammo.low #cs-magbar i  { background:linear-gradient(90deg,#c98a25,#f2b23c); }
  /* nothing left anywhere */
  #cs-ammo.dry #cs-ammo-clip { color:#e64b3c; animation:ammoPulse 1s ease-in-out infinite; }
  #cs-ammo.dry #cs-magbar i  { background:#6b2f28; }
  @keyframes ammoPulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  /* melee: no numbers to show */
  #cs-ammo.melee #cs-magbar, #cs-ammo.melee #cs-mags { display:none; }
  #cs-ammo.melee #cs-ammo-clip { font-size:40px; color:#8c99a6; }

  #cs-money {
    position:absolute; bottom:104px; left:30px; pointer-events:none;
    color:#7ee787; font-size:30px; font-weight:bold; letter-spacing:1px;
    font-family:'Stratum2','Arial Narrow',sans-serif;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);
  }
  #cs-kills {
    position:absolute; top:24px; left:50%; transform:translateX(-50%); pointer-events:none;
    color:#cfd6dc; font-size:16px; font-weight:bold; letter-spacing:3px;
    font-family:'Stratum2','Arial Narrow',sans-serif;
    background:rgba(10,12,16,0.6); padding:6px 16px; border-radius:4px;
  }
  #cs-slots {
    position:absolute; top:50%; right:22px; transform:translateY(-50%);
    pointer-events:none;
    display:flex; flex-direction:column; gap:11px; align-items:flex-end;
    font-family:'Arial Narrow','Segoe UI',sans-serif;
  }
  .cs-slot {
    display:flex; align-items:center; gap:9px;
    color:#ffffff; font-size:30px; font-weight:bold; letter-spacing:0.5px;
    text-shadow:0 2px 4px rgba(0,0,0,0.9);
  }
  .cs-slot.active { color:#ffe11a; }       /* bright yellow for the equipped slot */
  .cs-slot.empty  { color:#ffffff; }
  .cs-slot-num {
    display:inline-block; width:30px; height:30px; line-height:30px; text-align:center;
    font-size:18px; font-weight:bold; color:#dfe4ea;
    background:rgba(20,24,30,0.85); border-radius:6px;
    text-shadow:none;
  }
  .cs-slot.active .cs-slot-num { color:#f2c14e; }
  #cs-pickup-prompt {
    position:absolute; bottom:170px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:18px; font-weight:bold; letter-spacing:2px;
    background:rgba(0,0,0,0.6); padding:8px 16px; border-radius:5px;
    border:1px solid #ffcc44; display:none; pointer-events:none;
    font-family:'Stratum2','Arial Narrow',sans-serif;
  }
  #crosshair { position:absolute; top:50%; left:50%; width:16px; height:16px; transform:translate(-50%,-50%); pointer-events:none; }
  body.driving #crosshair { display:none; }
  body.scoped #crosshair { display:none; }
  #scope-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none; z-index:50; }
  #scope-overlay svg { width:100%; height:100%; }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:var(--xhair,#f00); }
  #crosshair::before { top:50%; width:100%; height:2px; margin-top:-1px; }
  #crosshair::after  { left:50%; width:2px; height:100%; margin-left:-1px; }
  /* ── DEPLOY SCREEN ── the palace itself as the backdrop ── */
  #instructions {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; justify-content:center; align-items:center;
    z-index:100; color:#f2e8d5;
    background:#0d0a07;
  }
  /* the screenshot, covering the viewport */
  
  /* scrim: keeps the text readable over a bright, low-contrast image, and
     darkens the edges so the panel reads as the focal point */
  
  @keyframes menuDrift {
    from { transform:scale(1.06) translate3d(-1.1%, 0.5%, 0); }
    to   { transform:scale(1.12) translate3d(1.1%, -0.9%, 0); }
  }
  /* z-index 2 matters: the scrim pseudo-element is z-index 1, and a positioned
     element with z-index:auto would paint UNDER it, hiding the whole panel. */
  .menu-card {
    position:relative; z-index:2; text-align:center; padding:0 26px;
    width:100%; max-width:800px;
  }
  .menu-screen { display:none; }
  .menu-screen.on { display:block; animation:menuIn .22s ease-out; }
  @keyframes menuIn { from{opacity:0; transform:translateY(9px);} to{opacity:1;} }
  .menu-kicker { font-size:11px; letter-spacing:7px; color:#c98f4a; font-weight:700; margin-bottom:15px; }
  #instructions h1 {
    font-size:58px; letter-spacing:16px; margin:0; font-weight:800;
    color:#f7edda; text-shadow:0 3px 26px rgba(0,0,0,.8);
  }
  .menu-rule { width:190px; height:2px; margin:18px auto 16px;
    background:linear-gradient(90deg,transparent,#d9b25a,transparent); }
  #instructions p { margin:0 auto 26px; max-width:520px; line-height:1.7;
    font-size:15px; color:#c3ad87; }
  .menu-btns { display:flex; flex-direction:column; align-items:center; gap:11px; }
  .mbtn {
    width:286px; padding:14px 0; border-radius:3px; cursor:pointer;
    font:800 14px/1 inherit; letter-spacing:5px;
    border:1px solid rgba(217,178,90,.42);
    color:#e9d9b4; background:rgba(30,22,14,.55);
    transition:transform .12s, background .12s, color .12s, box-shadow .12s;
  }
  .mbtn:hover { background:rgba(217,178,90,.16); color:#fff4dd; transform:translateY(-1px); }
  .mbtn.primary {
    border:none; color:#20160b; background:linear-gradient(#e8c877,#c99a3f);
    box-shadow:0 5px 22px rgba(201,154,63,.32);
    font-size:15px; letter-spacing:6px; padding:16px 0;
  }
  .mbtn.primary:hover { filter:brightness(1.09); box-shadow:0 8px 28px rgba(201,154,63,.45); }
  .menu-foot { margin-top:24px; font-size:11px; letter-spacing:3px; color:#7b6c56; }
  .menu-h2 { font-size:26px; letter-spacing:9px; margin:0 0 6px; color:#f4e9d3; font-weight:800; }
  .menu-sub { font-size:11px; letter-spacing:4px; color:#c98f4a; font-weight:700; margin-bottom:4px; }
  .menu-scroll { max-height:54vh; overflow-y:auto; padding:0 8px; }
  .menu-scroll::-webkit-scrollbar { width:7px; }
  .menu-scroll::-webkit-scrollbar-thumb { background:rgba(217,178,90,.28); border-radius:4px; }

  /* ── settings rows ── */
  .set-list { max-width:540px; margin:20px auto 6px; text-align:left; }
  .set-row {
    display:grid; grid-template-columns:1fr 32px 116px 32px; align-items:center;
    gap:6px; padding:9px 10px; border-bottom:1px solid rgba(217,178,90,.13);
  }
  .set-row:hover { background:rgba(217,178,90,.06); }
  .set-label { font-size:12px; letter-spacing:2.4px; color:#b8a582; }
  .set-value { text-align:center; font:700 12.5px/1 ui-monospace,monospace;
    letter-spacing:1px; color:#f0dcae; }
  .set-arrow {
    width:29px; height:29px; border-radius:3px; cursor:pointer;
    border:1px solid rgba(217,178,90,.34); background:transparent;
    color:#d9b25a; font:700 15px/1 inherit; transition:background .1s,color .1s;
  }
  .set-arrow:hover { background:rgba(217,178,90,.2); color:#fff1cf; }
  .set-note { font-size:11px; color:#7d6f5a; letter-spacing:.6px;
    max-width:540px; margin:14px auto 0; line-height:1.6; }

  /* ── tutorial ── */
  .tut { max-width:700px; margin:16px auto 0; text-align:left; }
  .tut-sec { font-size:11px; letter-spacing:5px; color:#c98f4a; font-weight:700; margin:16px 0 9px; }
  .tut p { font-size:13px; color:#a8977a; margin:0 0 10px; max-width:none; line-height:1.68; }
  .tut b { color:#e2cfa4; font-weight:700; }
  .tut-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:8px 14px; }
  .tut-grid div { font-size:12.5px; color:#a8977a; display:flex; align-items:center; gap:8px; }
  kbd {
    display:inline-block; min-width:20px; padding:4px 7px; text-align:center;
    font:700 10.5px/1 ui-monospace,monospace; letter-spacing:1px;
    color:#f2e3c4; background:rgba(217,178,90,.10);
    border:1px solid rgba(217,178,90,.40); border-radius:4px;
  }
  .tut-map { display:block; margin:4px auto 8px; width:100%; max-width:420px; }
#reload-msg { position:absolute; top:60%; left:50%; transform:translateX(-50%); color:#f80; font-size:22px; display:none; font-weight:bold; letter-spacing:3px; }
  #hit-flash  { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0); pointer-events:none; transition:background 0.08s; }
  #enter-prompt {
    position:absolute; top:62%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:20px; font-weight:bold; letter-spacing:2px;
    background:rgba(0,0,0,0.65); padding:9px 18px; border-radius:5px;
    border:2px solid #ffcc44; display:none; pointer-events:none;
  }
  #enter-prompt b { color:#ffcc44; }
  #speedo {
    position:absolute; bottom:30px; right:30px; color:#fff; font-size:18px; font-weight:bold;
    background:rgba(20,25,35,0.85); padding:12px 20px; border-radius:7px;
    pointer-events:none; border:2px solid #ffcc44; display:none; letter-spacing:2px;
    text-align:center; min-width:140px;
  }
  #speedo .big { font-size:36px; color:#ffcc44; display:block; line-height:1; }
  #speedo .lbl { font-size:11px; color:#aaa; letter-spacing:3px; }
  /* (money now styled as #cs-money above) */
  /* Shop button (top-right) */
  #shop-btn {
    position:absolute; top:24px; right:30px; z-index:60;
    padding:10px 22px; background:rgba(20,25,35,0.9); color:#ffcc44;
    border:2px solid #ffcc44; border-radius:7px; font-size:16px; font-weight:bold;
    letter-spacing:3px; cursor:pointer; font-family:'Segoe UI',sans-serif;
  }
  #shop-btn:hover { background:rgba(255,204,68,0.18); }
  /* ── ARMORY ── */
  #shop {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(70,52,30,0.55) 0%, rgba(12,9,6,0.97) 66%),
      linear-gradient(#12100c, #0b0907);
    z-index:90; display:none; flex-direction:column; align-items:center;
    padding:26px 20px 20px; box-sizing:border-box; overflow:hidden; color:#f0e4cc;
  }
  #shop h2 {
    font-size:26px; letter-spacing:11px; margin:0; font-weight:800; color:#f7edda;
  }
  #shop .shop-sub { font-size:10px; letter-spacing:6px; color:#c98f4a; font-weight:700; margin-bottom:10px; }
  #shop .shop-money {
    font:800 25px/1 ui-monospace, monospace; color:#8fe6a6; letter-spacing:1px;
    margin:2px 0 4px; text-shadow:0 0 18px rgba(90,220,130,0.28);
  }
  #shop .shop-bar { width:min(1080px,94%); height:1px; margin:12px 0 4px;
    background:linear-gradient(90deg,transparent,rgba(217,178,90,.5),transparent); }
  #shop-list { width:min(1080px,94%); overflow-y:auto; padding:10px 6px 4px; flex:1; }
  #shop-list::-webkit-scrollbar { width:8px; }
  #shop-list::-webkit-scrollbar-thumb { background:rgba(217,178,90,.28); border-radius:4px; }
  .shop-section-header {
    color:#c98f4a; font-size:10px; font-weight:800; letter-spacing:6px;
    margin:16px 0 9px; display:flex; align-items:center; gap:12px;
  }
  .shop-section-header::after { content:''; flex:1; height:1px; background:rgba(217,178,90,.18); }
  .shop-section-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:12px; }
  .shop-card {
    position:relative; padding:14px 14px 13px; border-radius:5px; text-align:left;
    background:linear-gradient(rgba(60,46,28,0.34), rgba(26,20,13,0.46));
    border:1px solid rgba(217,178,90,0.20);
    transition:border-color .14s, transform .14s, box-shadow .14s;
  }
  .shop-card:hover { border-color:rgba(217,178,90,0.55); transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,0.45); }
  .shop-card.owned { border-color:rgba(90,150,220,0.45); }
  .shop-card.equipped-card { border-color:#d9b25a; box-shadow:0 0 0 1px rgba(217,178,90,0.35) inset; }
  .sc-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .shop-card .sc-name { font-size:15px; font-weight:800; letter-spacing:2px; color:#f4e7cd; }
  .sc-price { font:700 12px/1 ui-monospace,monospace; color:#8fe6a6; white-space:nowrap; }
  .sc-price.cant { color:#c9615a; }
  .sc-price.owned { color:#7fb2e8; }
  .sc-cat { font-size:9px; letter-spacing:3px; color:#8a7a5c; margin:3px 0 10px; }
  .sc-bars { margin-bottom:11px; }
  .sc-bar { display:grid; grid-template-columns:34px 1fr; align-items:center; gap:7px; margin-bottom:4px; }
  .sc-bar span { font-size:8.5px; letter-spacing:1.4px; color:#8a7a5c; }
  .sc-bar i { display:block; height:4px; border-radius:2px; background:rgba(255,255,255,0.07); overflow:hidden; }
  .sc-bar i b { display:block; height:100%; border-radius:2px;
    background:linear-gradient(90deg,#c98f4a,#e8c877); }
  .sc-meta { display:flex; gap:10px; font-size:9.5px; color:#8a7a5c; letter-spacing:1px; margin-bottom:11px; }
  .shop-card .sc-btn {
    width:100%; padding:9px 0; border:none; border-radius:3px; cursor:pointer;
    font:800 11px/1 inherit; letter-spacing:3px;
  }
  .sc-btn.buy { background:linear-gradient(#e8c877,#c99a3f); color:#231806; }
  .sc-btn.buy:hover { filter:brightness(1.1); }
  .sc-btn.buy.locked { background:rgba(90,72,48,0.4); color:#7d6a4c; cursor:not-allowed; }
  .sc-btn.equip { background:rgba(90,150,220,0.22); color:#bcd9f5; border:1px solid rgba(90,150,220,0.5); }
  .sc-btn.equip:hover { background:rgba(90,150,220,0.36); }
  .sc-btn.equipped { background:transparent; color:#d9b25a; border:1px solid rgba(217,178,90,0.55); cursor:default; }
  #shop .hint { color:#7d6f5a; font-size:10.5px; margin-top:10px; letter-spacing:1.5px; }
  #shop-close {
    margin-top:12px; padding:12px 44px; border:none; border-radius:3px; cursor:pointer;
    font:800 12px/1 inherit; letter-spacing:5px; color:#20160b;
    background:linear-gradient(#e8c877,#c99a3f);
  }
  #shop-close:hover { filter:brightness(1.1); }
</style>

<!-- ── BOOT SCREEN ───────────────────────────────────────────────────────────
     Same problem as the dev loader: #instructions is in the markup with
     display:flex, so it paints before the inlined script (which builds the
     whole map) has run. Hidden from frame one; e0-title.js removes both this
     and the hide when it is ready. The bar is indeterminate here because the
     bundle is a single script with nothing to count.
     ────────────────────────────────────────────────────────────────────────── -->
<style>
  #boot{position:fixed;inset:0;z-index:500;background:#0b0d11;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    font-family:'Stratum2','Arial Narrow','Segoe UI',sans-serif;color:#f4ecdc;
    transition:opacity .5s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .bt{font-size:clamp(32px,5.4vw,66px);font-weight:800;letter-spacing:.15em;line-height:1}
  #boot .bt i{font-style:normal;color:#c98f4a}
  #boot .btrack{width:min(260px,54vw);height:2px;background:rgba(255,255,255,.10);
    margin-top:26px;overflow:hidden;position:relative}
  #boot .bfill{position:absolute;top:0;left:0;height:100%;width:40%;
    background:linear-gradient(90deg,transparent,#c98f4a,#f0cf7c,transparent);
    animation:bootSlide 1.15s ease-in-out infinite}
  @keyframes bootSlide{0%{left:-45%}100%{left:100%}}
  #boot .bs{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;
    color:#6f6656;margin-top:13px}
  @media (prefers-reduced-motion:reduce){ #boot .bfill{animation:none;left:0;width:100%} }
</style>
<script>
  document.documentElement.classList.add('booting');
  setTimeout(function(){
    if(!document.body || !document.body.classList.contains('tt-has-lobby')){
      document.documentElement.classList.remove('booting');
      var b=document.getElementById('boot'); if(b) b.classList.add('gone');
    }
  }, 20000);
</script>
<style>
  /* The old menu is retired. !important outranks the inline display that
     70-hud and 90-input still set, so nothing can bring it back. */
  #instructions{ display:none !important; }
</style>
</head>
<body>
<div id="boot">
  <div class="bt"><i>DE_</i>ALCAZAR</div>
  <div class="btrack"><div class="bfill"></div></div>
  <div class="bs">Loading</div>
</div>
<!-- ── the old title menu is gone ────────────────────────────────────────────
     Removed permanently. e0-title.js draws the real one over the live map.

     This inert stub remains ONLY because ten places call getElementById on
     these ids without a null check (70-hud's resetGame; 90-input's start
     button, pointerlockchange and shop; b0-menu's settings and tutorial
     buttons). Deleting the ids outright throws at 90-input.js line 2 and takes
     every part loaded after it down with it.

     It carries no content and no background, and the rule
     `#instructions{display:none!important}` in the stylesheet outranks any
     `el.style.display='flex'` those files perform -- a stylesheet !important
     beats a normal inline declaration -- so it can never be seen again,
     whatever sets it.
     ───────────────────────────────────────────────────────────────────────── -->
<div id="instructions" aria-hidden="true">
  <div class="menu-screen on" id="scr-main">
    <h1 id="title">DE_ALCAZAR</h1>
    <p id="desc"></p>
    <button id="start-btn" type="button"></button>
    <button id="btn-settings" type="button"></button>
    <button id="btn-tutorial" type="button"></button>
  </div>
  <div class="menu-screen" id="scr-settings"><div class="set-list" id="set-list"></div></div>
</div>
<div id="cs-health">
  <div class="cs-row">
